name: Discord Notifications

on:
  push:
  issues:
    types: [opened, closed]
  pull_request:
    types: [opened, closed, merged]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Embed ke Discord
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **🚀 Activity Report**
            ────────────────
            **Repository** : {{ EVENT_PAYLOAD.repository.full_name }}
            **Actor**      : {{ EVENT_PAYLOAD.sender.login }}
            **Event**      : {{ EVENT_PAYLOAD.action | default("push") }}
            **Branch**     : {{ EVENT_PAYLOAD.ref | default("main") }}
            **Commit**     : {{ EVENT_PAYLOAD.head_commit.message | default("N/A") }}
            ────────────────
            🔗 [View on GitHub]({{ EVENT_PAYLOAD.repository.html_url }})
